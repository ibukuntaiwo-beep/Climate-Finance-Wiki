<title>CFW Landing Redesign — Review Gallery</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #18181B;
    --panel: #202024;
    --panel-border: #303036;
    --text: #E4E4E7;
    --text-muted: #9A9AA2;
    --text-faint: #6B6B74;
    --accent: #E4E4E7;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    padding: 40px 24px 64px;
  }

  header {
    max-width: 1100px;
    margin: 0 auto 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  @media (max-width: 760px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  a.tile {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  a.tile:hover {
    border-color: #4A4A54;
    transform: translateY(-1px);
  }

  a.tile:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .preview {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #0F0F11;
    overflow: hidden;
    border-bottom: 1px solid var(--panel-border);
  }

  .preview iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: 0;
    pointer-events: none;
    transform-origin: top left;
    background: #fff;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 13px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: #0F0F11;
  }

  .info {
    padding: 14px 16px;
  }

  .info .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 4px;
  }

  .info .title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }

  .info .desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .pending .info .title,
  .pending .info .desc {
    color: var(--text-faint);
  }

  .pending .info .num {
    color: var(--text-faint);
  }

  footer {
    max-width: 1100px;
    margin: 48px auto 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
  }
</style>

<header>
  <h1>Climate Finance Wiki — Landing Redesign Review</h1>
  <p>Open each option full-screen. Claude options 1–4; Codex options 5–8.</p>
</header>

<div class="grid" id="grid"></div>

<footer>Branch: design/landing-reimagine — worktree: Websites/cfw-landing-redesign</footer>

<script>
  var options = [
    { num: 1, file: "option-1-the-ledger.html", title: "The Ledger", desc: "Editorial broadsheet, light" },
    { num: 2, file: "option-2-the-institution.html", title: "The Institution", desc: "Dark sovereign capital" },
    { num: 3, file: "option-3-the-index.html", title: "The Index", desc: "Swiss typographic archive" },
    { num: 4, file: "option-4-the-atlas.html", title: "The Atlas", desc: "Data-forward, animated capital flows" },
    { num: 5, file: "codex-option-1.html", title: "Codex Option 5", desc: "pending", pending: true },
    { num: 6, file: "codex-option-2.html", title: "Codex Option 6", desc: "pending", pending: true },
    { num: 7, file: "codex-option-3.html", title: "Codex Option 7", desc: "pending", pending: true },
    { num: 8, file: "codex-option-4.html", title: "Codex Option 8", desc: "pending", pending: true }
  ];

  var grid = document.getElementById("grid");

  options.forEach(function (opt) {
    var tile = document.createElement("a");
    tile.className = "tile" + (opt.pending ? " pending" : "");
    tile.href = opt.file;
    tile.target = "_blank";
    tile.rel = "noopener";

    var preview = document.createElement("div");
    preview.className = "preview";

    var iframe = document.createElement("iframe");
    iframe.src = opt.file;
    iframe.loading = "lazy";
    iframe.setAttribute("tabindex", "-1");

    function showPlaceholder() {
      if (!preview.contains(iframe)) return;
      preview.removeChild(iframe);
      var ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "Not yet delivered";
      preview.appendChild(ph);
    }

    iframe.addEventListener("error", showPlaceholder);
    preview.appendChild(iframe);

    // Scale the 1280px-wide iframe down to fit the tile.
    function scaleToFit() {
      var w = preview.clientWidth;
      if (!w) return;
      var scale = w / 1280;
      iframe.style.transform = "scale(" + scale + ")";
      iframe.style.height = (preview.clientHeight / scale) + "px";
    }
    window.addEventListener("resize", scaleToFit);

    // Best-effort existence check via fetch HEAD. On file:// this will
    // usually fail/throw, so we just leave the iframe as-is in that case.
    try {
      if (window.location.protocol !== "file:" && window.fetch) {
        fetch(opt.file, { method: "HEAD" })
          .then(function (res) {
            if (!res.ok) showPlaceholder();
          })
          .catch(function () {
            // Network/fetch failure: leave iframe as-is, onerror/onload
            // on the iframe itself is the fallback signal.
          });
      }
    } catch (e) {
      // Swallow: never let the existence check break the gallery.
    }

    var info = document.createElement("div");
    info.className = "info";

    var num = document.createElement("div");
    num.className = "num";
    num.textContent = "#" + opt.num;

    var title = document.createElement("div");
    title.className = "title";
    title.textContent = opt.pending ? "Codex Option " + opt.num + " — pending" : opt.title;

    var desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = opt.desc;

    info.appendChild(num);
    info.appendChild(title);
    info.appendChild(desc);

    tile.appendChild(preview);
    tile.appendChild(info);
    grid.appendChild(tile);
    scaleToFit();
  });
</script>
